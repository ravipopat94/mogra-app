<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Collar Icon Preview</title>
  <style>
    body { font-family: sans-serif; background: #f5f0eb; display: flex; gap: 48px; padding: 48px; align-items: flex-start; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    svg { width: 120px; height: 112px; color: #1a1a1a; }
    p { font-size: 13px; color: #555; text-align: center; max-width: 130px; }
    h3 { font-size: 13px; font-weight: 600; margin: 0; }
  </style>
</head>
<body>

  <!-- Standard Collar -->
  <div class="item">
    <svg viewBox="0 0 60 56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4,54 L 4,26 L 18,14 L 42,14 L 56,26 L 56,54 Z" />
      <line x1="30" y1="28" x2="30" y2="54" />
      <path d="M 18,14 L 6,6 L 22,24 L 30,28" />
      <path d="M 42,14 L 54,6 L 38,24 L 30,28" />
      <path d="M 18,14 Q 30,12 42,14" />
    </svg>
    <h3>Standard Collar</h3>
    <p>Classic fold-over collar with pointed tips</p>
  </div>

  <!-- Chinese Collar -->
  <div class="item">
    <svg viewBox="0 0 60 56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4,54 L 4,26 L 18,14 L 42,14 L 56,26 L 56,54 Z" />
      <line x1="30" y1="14" x2="30" y2="54" />
      <path d="M 22,14 L 22,8 Q 26,6 27,7" />
      <path d="M 38,14 L 38,8 Q 34,6 33,7" />
      <path d="M 22,14 Q 30,12 38,14" />
      <circle cx="30" cy="22" r="1.5" fill="currentColor" stroke="none" />
      <circle cx="30" cy="32" r="1.5" fill="currentColor" stroke="none" />
      <circle cx="30" cy="42" r="1.5" fill="currentColor" stroke="none" />
    </svg>
    <h3>Chinese Collar</h3>
    <p>Minimal standing band with no fold</p>
  </div>

  <!-- Cuban Collar -->
  <div class="item">
    <svg viewBox="0 0 60 56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4,54 L 4,26 L 18,14 L 42,14 L 56,26 L 56,54 Z" />
      <line x1="30" y1="38" x2="30" y2="54" />
      <path d="M 18,14 L 8,8 L 30,38" />
      <path d="M 42,14 L 52,8 L 30,38" />
      <path d="M 8,8 Q 30,5 52,8" />
    </svg>
    <h3>Cuban Collar</h3>
    <p>Wide open camp-style collar, lies flat</p>
  </div>

</body>
</html>
